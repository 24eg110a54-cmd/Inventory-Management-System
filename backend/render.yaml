services:
  - type: web
    name: inventory-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/products/stats
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173,http://localhost:3000

databases:
  - name: inventory-db
    plan: free
    region: oregon
    databaseName: inventory
    user: inventory_user
