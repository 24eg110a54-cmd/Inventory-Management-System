services:
  - type: web
    name: inventory-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/products/stats
    envVars:
      - key: PORT
        value: 8080

      # ── TiDB Cloud Connection ───────────────────────────────
      # Format: jdbc:mysql://HOST:PORT/DATABASE?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
      - key: SPRING_DATASOURCE_URL
        sync: false   # Set manually in Render dashboard (keeps password secret)

      - key: SPRING_DATASOURCE_USERNAME
        sync: false   # Set manually in Render dashboard

      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # Set manually in Render dashboard

      # TiDB uses MySQL dialect
      - key: JPA_DIALECT
        value: org.hibernate.dialect.MySQLDialect

      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173,http://localhost:3000
