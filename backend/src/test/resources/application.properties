# Test profile: uses a fresh in-memory H2 so tests never conflict with a running backend
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Disable schema.sql execution in tests — Hibernate create-drop handles DDL
spring.sql.init.mode=never
