# Server configuration
# Render assigns a dynamic port via the PORT environment variable
server.port=${PORT:8081}

# Application Name
spring.application.name=inventory-management-system

# ─────────────────────────────────────────────────────────────────
# Database Configuration
# Local default: H2 in-memory/file DB for development (no install needed)
# Production (Render + TiDB): Set SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD
# ─────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/inventorydb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
# TiDB uses MySQL dialect; H2 auto-detects locally
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (local dev only at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}
