# Server configuration
# Render assigns a dynamic port via the PORT environment variable
server.port=${PORT:8081}

# Application Name
spring.application.name=inventory-management-system

# Database Configuration
# Local default: Persistent H2 SQL file database in ./data/inventorydb
# Production (Render): Overridden by SPRING_DATASOURCE_URL or DATABASE_URL environment variable
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/inventorydb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console during local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CORS configuration defaults
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}
